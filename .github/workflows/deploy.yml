name: Deploy Kuturogi Project

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. フロントエンドのビルド (TypeScriptをJSにコンパイル)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install & Build Frontend
        run: |
          npm install
          npm run build

      # 2. バックエンドの準備 (PHP/Composer)
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4' # ロリポップの設定に合わせる
      - name: Install Composer Dependencies
        run: composer install --optimize-autoloader --no-dev

      # 3. rsyncによる転送 (登録名に合わせて SSH_ を付与)
      - name: Deploy via rsync
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > deploy_key
          chmod 600 deploy_key
          rsync -avzr --delete \
            -e "ssh -p ${{ secrets.SSH_PORT }} -i ./deploy_key -o StrictHostKeyChecking=no" \
            --exclude='.git*' \
            --exclude='.env' \
            --exclude='node_modules' \
            --exclude='storage/logs/*' \
            --exclude='storage/framework/cache/*' \
            --exclude='storage/framework/sessions/*' \
            --exclude='storage/framework/views/*' \
            ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/home/users/1/moo.jp-t-s-p/web/kuturogi/
          rm deploy_key

      # 4. サーバー上での後処理 (SSH)
      - name: Post-deployment commands
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd /home/users/1/moo.jp-t-s-p/web/kuturogi/
            # ロリポップのPHP 8.4のパスを指定
            /usr/local/php/8.4/bin/php artisan migrate --force
            /usr/local/php/8.4/bin/php artisan config:cache
            /usr/local/php/8.4/bin/php artisan route:cache
            /usr/local/php/8.4/bin/php artisan view:cache
